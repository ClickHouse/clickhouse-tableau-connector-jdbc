# Runs Tableau TDVT (ClickHouse/clickhouse-tableau-tdvt) against this connector and mirrors its
# result as a check - the same way clickhouse-java's nightly/release `tdvt` job does.
#
# pull_request_target, not pull_request: fork PRs get no secrets under pull_request, so they could
# never start the run. This workflow comes from the base branch and never checks out PR code - it
# only hands the PR's head SHA over. Same-repo PRs run on every push. Fork and Dependabot PRs run
# only when a maintainer adds the `run-cloud-tests` label, as in our other connectors: the label
# approves the head SHA it was added on, and the workflow removes it so a later push needs a new
# one. Every PR run includes the `cloud` target, so review a fork PR before labelling it - the
# connector builds the JDBC URL and could send the Cloud password anywhere.
name: TDVT

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: "Connector branch/tag/SHA to test (blank = the branch this workflow runs from)"
        required: false
      jdbc_version:
        description: "clickhouse-jdbc version (blank = latest release)"
        required: false
      ch_targets:
        description: "ClickHouse targets (CSV of: latest,head,cloud)"
        default: "latest,head,cloud"

# A new run supersedes a pending wait; the TDVT run it already started finishes on its own. Events
# that start nothing (a push to a fork PR, any other label) get their own group so they cannot
# cancel a labelled run.
concurrency:
  group: >-
    tdvt-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, inputs.ref) }}${{
    github.event_name == 'pull_request_target' && !((
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.action != 'labeled'
    ) || (
      github.event.action == 'labeled' && github.event.label.name == 'run-cloud-tests'
    )) && format('-skip-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unlabel:
    if: github.event.action == 'labeled' && github.event.label.name == 'run-cloud-tests'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the run-cloud-tests label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/run-cloud-tests" || true

  tdvt:
    name: "Tableau TDVT"
    # Same-repo PRs on open/push (not on labels); fork and Dependabot PRs only on run-cloud-tests.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.action != 'labeled'
      ) || (
        github.event.action == 'labeled' && github.event.label.name == 'run-cloud-tests'
      )
    runs-on: "ubuntu-latest"
    timeout-minutes: 150 # the TDVT matrix (latest/head/cloud, single-threaded) runs ~1h; allow for a queue
    steps:
      # The base branch's copy (pull_request_target) or the dispatched branch's - never the PR head.
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mint a token for the TDVT repo (dispatch + read the run)
        id: tdvt-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WORKFLOW_AUTH_PUBLIC_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_AUTH_PUBLIC_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "clickhouse-tableau-tdvt"
      - name: Run Tableau TDVT and mirror its result
        env:
          GH_TOKEN: ${{ steps.tdvt-token.outputs.token }}
          CONNECTOR_REF: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
          INPUT_JDBC: ${{ inputs.jdbc_version }}
          CH_TARGETS: ${{ inputs.ch_targets || 'latest,head,cloud' }}
        run: |
          set -euo pipefail
          JDBC_VERSION="${INPUT_JDBC:-$(gh api repos/ClickHouse/clickhouse-java/releases/latest --jq .tag_name)}"
          python3 .github/scripts/mirror_tdvt.py \
            --event-type connector-pr \
            --version "${JDBC_VERSION#v}" \
            --correlation-id "${{ github.repository }}#${{ github.run_id }}-${{ github.run_attempt }}" \
            --connector-ref "$CONNECTOR_REF" \
            --ch-targets "$CH_TARGETS"
